name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What user need should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
