name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem. Remove secrets and personal or portfolio data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, database, and relevant configuration (no credentials).
  - type: dropdown
    id: feature
    attributes:
      label: Affected feature
      options:
        - Setup or startup
        - Portfolio or transactions
        - Company events or documents
        - Financial results or AI analysis
        - Valuation, thesis, or forecast accuracy
        - Company Memory or autonomous research
        - Telegram or market briefs
        - IPOs
        - Gold
        - Documentation
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove tokens, chat identifiers, signed links, account details, and private portfolio data. Do not paste your .env file.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials and personal data, and this is not a private security vulnerability report.
          required: true
