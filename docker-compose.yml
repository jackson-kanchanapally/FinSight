services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-finsight}
      POSTGRES_USER: ${DATABASE_USER:-finsight}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-finsight_dev}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - finsight_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-finsight} -d ${DATABASE_NAME:-finsight}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - almonds_qdrant:/qdrant/storage

volumes:
  finsight_postgres:
  almonds_qdrant:
