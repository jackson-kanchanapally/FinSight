services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-portfolioai}
      POSTGRES_USER: ${DATABASE_USER:-portfolioai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-portfolioai_dev}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - portfolioai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-portfolioai} -d ${DATABASE_NAME:-portfolioai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolioai_postgres:
